site_name: simplegrad
site_description: A lightweight autograd engine for education and experimentation.
site_url: https://simplegrad.github.io/simplegrad/

repo_url: https://github.com/simplegrad/simplegrad
repo_name: simplegrad/simplegrad

theme:
  name: material
  custom_dir: docs/overrides
  favicon: images/favicon.svg
  logo: images/favicon.svg
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_root_toc_entry: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 80
            merge_init_into_class: true
            heading_level: 3
            docstring_style: google
            docstring_section_style: table
            annotations_path: brief
            show_bases: true
            members_order: source
            filters:
              - "!^_"
              - "^__init__$"

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Introduction: introduction.md
  - Core:
    - Tensor & Autograd: api/core/autograd.md
    - Function & Context: api/core/function.md
    - Compound Ops: api/core/compound_ops.md
    - Dtypes: api/dtypes.md
    - Factory Functions: api/factory.md
    - Module: api/core/module.md
    - Optimizer: api/core/optimizer.md
    - Scheduler: api/core/scheduler.md
  - Functions:
    - Math: api/functions/math.md
    - Activations: api/functions/activations.md
    - Reductions: api/functions/reduction.md
    - Transform: api/functions/transform.md
    - Conv2d: api/functions/conv.md
    - Pooling: api/functions/pooling.md
    - Losses: api/functions/losses.md
  - NN Layers:
    - Linear: api/nn/linear.md
    - Conv2d: api/nn/conv.md
    - Sequential: api/nn/sequential.md
    - Dropout: api/nn/dropout.md
    - MaxPool2d: api/nn/pooling.md
    - Flatten: api/nn/transform.md
    - Embedding: api/nn/embedding.md
    - Activations: api/nn/activations.md
    - Losses: api/nn/losses.md
  - Optimizers:
    - SGD: api/optimizers/sgd.md
    - Adam: api/optimizers/adam.md
  - Schedulers:
    - Overview: api/schedulers/linear.md
  - Tracking: api/track.md
  - Visualization: api/visual.md
